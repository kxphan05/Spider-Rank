[project]
name = "techjam-agent"
version = "0.1.0"
description = "TechJam conversational shopping agent"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
