[project]
name = "techjam-agent"
version = "0.1.0"
description = "TechJam conversational shopping agent"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Lint gate for our own code. The evaluator is organizer-provided and scored
# as-is, so it is excluded rather than reformatted:
#   uvx ruff check starter/ scripts/
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["evaluator"]

[tool.ruff.lint]
# F  pyflakes (dead imports, undefined names)   E9 syntax/IO errors
# B  bugbear (real footguns)                    C4 comprehension clarity
# SIM simplifications                           UP  py312 idioms
select = ["F", "E9", "B", "C4", "SIM", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
